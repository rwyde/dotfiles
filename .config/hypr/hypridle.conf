# Hypridle Configuration
# Idle management daemon for Hyprland

general {
    # Don't ignore any idle inhibitors to respect applications
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Turn off monitors after 30 minutes of inactivity
listener {
    timeout = 1800                           # 30 minutes (30 * 60 seconds)
    on-timeout = hyprctl dispatch dpms off   # turn monitors off
    on-resume = hyprctl dispatch dpms on     # turn monitors back on with any input
}
